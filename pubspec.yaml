name: spinverse
description: SpinVerse — futuristic offline party games.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  confetti: ^0.8.0
  lottie: ^3.3.1
  flutter_fortune_wheel: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/lottie/
